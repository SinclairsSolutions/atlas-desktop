[package]
name = "atlas-desktop"
version = "0.2.9"
description = "Sinclair Atlas als Desktop-App"
authors = ["Sinclairs Solutions"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-notification = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
tokio = { version = "1", features = ["time"] }
sys-locale = "0.3"
log = "0.4"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSError", "NSBundle", "NSObject", "NSDistributedNotificationCenter", "NSNotification"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
objc2-safari-services = { version = "0.3", default-features = false, features = ["std", "block2", "SFSafariApplication", "SFSafariExtensionManager", "SFSafariExtensionState"] }
block2 = "0.6"
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# "unwind" statt "abort": wry fängt WebKit-Ausnahmen (z. B. beim Öffnen
# neuer Fenster) nur ab, wenn abgewickelt werden darf — mit "abort" stürzte
# die App bei window.open(…, "noopener") ab.
panic = "unwind"
strip = true
