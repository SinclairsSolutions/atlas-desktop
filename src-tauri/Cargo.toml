[package]
name = "atlas-desktop"
version = "0.1.0"
description = "Sinclair Atlas als Desktop-App"
authors = ["Sinclairs Solutions"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-notification = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }
sys-locale = "0.3"
log = "0.4"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
