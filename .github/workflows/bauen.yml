# Desktop-App „Sinclair Atlas“ bauen.
#
#   macOS:   Universal (Apple Silicon + Intel), signiert mit „Developer ID
#            Application“, von Apple notarisiert, als DMG. Mit Updater-Paket.
#   Windows: NSIS-Installer (x64, Benutzerinstallation). Zwei Schalter (Repo-Variablen,
#            Settings → Secrets and variables → Actions → Variables):
#              WINDOWS_AUSLIEFERN = true  → bei Tags kommen Installer, Updater-Signatur
#                                            und der Eintrag „windows-x86_64“ in
#                                            latest.json in DENSELBEN Release-Entwurf
#                                            wie macOS (Job „windows-release“).
#                                  sonst   → wie bisher nur Artefakt, kein Updater-Paket,
#                                            nichts im Release.
#              WINDOWS_SIGNIEREN  = true  → Authenticode über Azure Trusted Signing.
#            Beide unabhängig: unsigniert ausliefern geht (SmartScreen warnt), siehe TODO.md §4.
#
# Start:
#   - Tag „v1.2.3“ pushen → Entwurf eines GitHub-Release mit DMG, Updater-Paket
#     und latest.json (erst nach „Publish“ sehen ihn die installierten Apps).
#   - Von Hand („Run workflow“ bzw. `gh workflow run bauen.yml`) → nur Artefakte.
#     Mit `-f windows_probe=true` baut Windows zusätzlich das Updater-Paket und
#     der Job „windows-release“ führt die latest.json-Zusammenführung als
#     Trockenlauf gegen den neuesten veröffentlichten Release aus (lädt nichts hoch).
#
# Alle Zugangsdaten kommen aus GitHub-Secrets (Namen wie im Atlas-Repo, siehe
# TODO.md). Im Repo steht nichts davon.
#
# Fremde Actions sind auf Commit-SHAs festgelegt (der Kommentar nennt das Tag):
# ein umgehängtes Tag könnte sonst Signier- und Updater-Schlüssel abgreifen.
# Aktualisieren: `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`.
name: Desktop-App bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_probe:
        description: "Windows: Updater-Paket bauen und latest.json-Zusammenführung trocken prüfen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (Universal, signiert, notarisiert)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten
        run: bun install --frozen-lockfile

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tag passt zur Version?
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu package.json ($V)"; exit 1
          fi

      - name: Secrets vorhanden?
        env:
          P12: ${{ secrets.APPLE_ZERTIFIKAT_P12 }}
          P12_PW: ${{ secrets.APPLE_ZERTIFIKAT_PASSWORT }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORT }}
          UPD_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          fehlt=0
          for n in P12 P12_PW TEAM APPLE_ID APP_PW UPD_KEY; do
            if [ -z "${!n}" ]; then echo "::error::Secret für $n fehlt (siehe TODO.md)"; fehlt=1; fi
          done
          if grep -q '"pubkey": "ERSETZEN' src-tauri/tauri.conf.json; then
            echo "::error::Updater-Pubkey in src-tauri/tauri.conf.json ist noch der Platzhalter (siehe TODO.md)"; fehlt=1
          fi
          exit $fehlt

      - name: Zertifikat in temporären Schlüsselbund
        env:
          P12: ${{ secrets.APPLE_ZERTIFIKAT_P12 }}
          P12_PW: ${{ secrets.APPLE_ZERTIFIKAT_PASSWORT }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signieren.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/zert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/zert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/zert.p12"
          IDENT=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENT" ]; then
            echo "::error::Kein „Developer ID Application“-Zertifikat im Secret APPLE_ZERTIFIKAT_P12"
            security find-identity -v -p codesigning "$KC"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENT" >> "$GITHUB_ENV"

      # Safari-Erweiterung „Atlas Passwort-Safe“ (aus safari-erweiterung/, übernommen
      # mit scripts/erweiterung-uebernehmen.sh) als .appex bauen und selbst signieren.
      # Tauri kopiert sie über bundle.macOS.files nach Contents/PlugIns, BEVOR es die
      # App signiert — und signiert die App ohne --deep: die Erweiterung behält ihre
      # eigene Signatur (mit Sandbox, Pflicht für App-Erweiterungen). Notarisierung,
      # DMG und Updater-Paket (.app.tar.gz) enthalten sie damit automatisch.
      - name: Safari-Erweiterung bauen und signieren
        env:
          # Muss mit der App-ID beginnen; derselbe Wert steht in src-tauri/src/safari.rs.
          ERWEITERUNG_ID: com.sinclairs-solutions.atlas.passwort-safe
        run: |
          set -euo pipefail
          test -f safari-erweiterung/manifest.json || { echo "::error::safari-erweiterung/ fehlt (scripts/erweiterung-uebernehmen.sh)"; exit 1; }
          V=$(bun -e 'console.log(require("./package.json").version)')
          ARBEIT="$RUNNER_TEMP/safari"
          rm -rf "$ARBEIT" && mkdir -p "$ARBEIT/quelle"
          cp -R safari-erweiterung/. "$ARBEIT/quelle/"
          rm -f "$ARBEIT/quelle/HERKUNFT.txt"

          xcrun safari-web-extension-converter "$ARBEIT/quelle" \
            --project-location "$ARBEIT/projekt" \
            --app-name "Sinclair Atlas" \
            --bundle-identifier com.sinclairs-solutions.atlas \
            --macos-only --copy-resources --no-open --no-prompt --force

          PROJ=$(find "$ARBEIT/projekt" -maxdepth 3 -name "*.xcodeproj" | head -1)
          test -n "$PROJ" || { echo "::error::Converter hat kein Xcode-Projekt erzeugt"; exit 1; }
          xcodebuild -list -json -project "$PROJ" > "$ARBEIT/liste.json"
          ZIEL=$(jq -r '.project.targets[] | select(test("Extension"))' "$ARBEIT/liste.json")
          if [ -z "$ZIEL" ] || [ "$(printf '%s\n' "$ZIEL" | wc -l | tr -d ' ')" != 1 ]; then
            echo "::error::Erweiterungs-Target nicht eindeutig:"; cat "$ARBEIT/liste.json"; exit 1
          fi
          echo "Target: $ZIEL"

          # Nur das Erweiterungs-Target, universal, unsigniert (signiert wird unten).
          xcodebuild -project "$PROJ" -target "$ZIEL" -configuration Release \
            SYMROOT="$ARBEIT/build" OBJROOT="$ARBEIT/obj" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=12.0 \
            PRODUCT_BUNDLE_IDENTIFIER="$ERWEITERUNG_ID" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$V" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

          GEBAUT=$(find "$ARBEIT/build" -maxdepth 3 -name "*.appex" -type d | head -1)
          test -n "$GEBAUT" || { echo "::error::Kein .appex gebaut"; exit 1; }
          NAME=$(basename "$GEBAUT")
          mkdir -p build/safari
          APPEX="$GITHUB_WORKSPACE/build/safari/$NAME"
          rm -rf "$APPEX" && ditto "$GEBAUT" "$APPEX"

          PL="$APPEX/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Atlas Passwort-Safe" "$PL" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Atlas Passwort-Safe" "$PL"
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PL")
          [ "$ID" = "$ERWEITERUNG_ID" ] || { echo "::error::Bundle-ID der Erweiterung ist $ID"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$PL"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PL")
          ARCHS=$(lipo -archs "$APPEX/Contents/MacOS/$EXE")
          echo "Architekturen: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::Erweiterung nicht universal ($ARCHS)"; exit 1;; esac

          # App-Erweiterungen laufen nur in der Sandbox (Rechte wie im Converter-Template).
          ENT="$ARBEIT/erweiterung.entitlements"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.files.user-selected.read-only</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$ENT"

          # Von innen nach außen: eventuell eingebettete Bibliotheken zuerst.
          find "$APPEX/Contents" \( -name "*.dylib" -o -name "*.framework" \) -prune -print0 \
            | while IFS= read -r -d '' TEIL; do
                codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$TEIL"
              done
          codesign --force --options runtime --timestamp --entitlements "$ENT" \
            --sign "$APPLE_SIGNING_IDENTITY" "$APPEX"
          codesign --verify --strict --verbose=2 "$APPEX"
          codesign -d --entitlements - "$APPEX"

          # Zusatz-Konfiguration für tauri build: .appex nach Contents/PlugIns kopieren.
          jq -n --arg k "PlugIns/$NAME" --arg v "$APPEX" '{bundle: {macOS: {files: {($k): $v}}}}' \
            > "$RUNNER_TEMP/tauri.safari.conf.json"
          cat "$RUNNER_TEMP/tauri.safari.conf.json"
          echo "ERWEITERUNG_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ERWEITERUNG_ID=$ERWEITERUNG_ID" >> "$GITHUB_ENV"

      # File-Provider-Erweiterung „Ablage im Finder“ (finder-ablage/) — ohne
      # Xcode-Projekt mit swiftc gebaut, universal, mit eigener Signatur
      # (Sandbox + App-Gruppe im macOS-Stil mit Team-ID, kein Profil nötig).
      # Kommt wie die Safari-Erweiterung über bundle.macOS.files nach Contents/PlugIns.
      - name: Ablage-Erweiterung bauen und signieren
        run: |
          set -euo pipefail
          mkdir -p build/ablage
          bash scripts/finder-ablage-bauen.sh "$GITHUB_WORKSPACE/build/ablage" "$APPLE_SIGNING_IDENTITY"
          APPEX="$GITHUB_WORKSPACE/build/ablage/AtlasAblage.appex"
          codesign -d --entitlements - "$APPEX"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APPEX/Contents/Info.plist"
          jq --arg v "$APPEX" '.bundle.macOS.files["PlugIns/AtlasAblage.appex"] = $v' \
            "$RUNNER_TEMP/tauri.safari.conf.json" > "$RUNNER_TEMP/tauri.erweiterungen.conf.json"
          cp "$RUNNER_TEMP/tauri.erweiterungen.conf.json" "$RUNNER_TEMP/tauri.safari.conf.json"
          cat "$RUNNER_TEMP/tauri.safari.conf.json"

      - name: Bauen, signieren, notarisieren (Release-Entwurf bei Tag)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notarisierung über Apple-ID + app-spezifisches Passwort (wie im Atlas-Repo).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signatur der Updater-Pakete (nicht Apple, sondern Tauri — siehe TODO.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin --bundles app,dmg --config ${{ runner.temp }}/tauri.safari.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Sinclair Atlas __VERSION__"
          releaseBody: "Neue Version der Desktop-App. Installierte Apps aktualisieren sich nach dem Veröffentlichen selbst."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Signatur und Notarisierung prüfen
        run: |
          set -euo pipefail
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          lipo -archs "$APP/Contents/MacOS/Sinclair Atlas"

          # Safari-Erweiterung: eingebaut, eigene Signatur mit Sandbox, gleiches Team.
          APPEX="$APP/Contents/PlugIns/$ERWEITERUNG_NAME"
          test -d "$APPEX" || { echo "::error::$APPEX fehlt in der App"; exit 1; }
          codesign --verify --strict --verbose=2 "$APPEX"
          RECHTE=$(codesign -d --entitlements - "$APPEX" 2>/dev/null || true)
          case "$RECHTE" in *com.apple.security.app-sandbox*) ;; *) echo "::error::Erweiterung ohne Sandbox-Recht signiert"; exit 1;; esac
          T_APP=$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          T_EXT=$(codesign -dv "$APPEX" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ -n "$T_APP" ] && [ "$T_APP" = "$T_EXT" ] || { echo "::error::Team-ID von App und Erweiterung verschieden"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Contents/Info.plist")" = "$ERWEITERUNG_ID" ]

          # Ablage-Erweiterung: eingebaut, Sandbox + App-Gruppe, gleiches Team.
          ABL="$APP/Contents/PlugIns/AtlasAblage.appex"
          test -d "$ABL" || { echo "::error::$ABL fehlt in der App"; exit 1; }
          codesign --verify --strict --verbose=2 "$ABL"
          RECHTE=$(codesign -d --entitlements - "$ABL" 2>/dev/null || true)
          case "$RECHTE" in *com.apple.security.app-sandbox*) ;; *) echo "::error::Ablage-Erweiterung ohne Sandbox"; exit 1;; esac
          case "$RECHTE" in *KJ63M9QZUG.com.sinclairs-solutions.atlas*) ;; *) echo "::error::Ablage-Erweiterung ohne App-Gruppe"; exit 1;; esac
          T_ABL=$(codesign -dv "$ABL" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ "$T_APP" = "$T_ABL" ] || { echo "::error::Team-ID der Ablage-Erweiterung verschieden"; exit 1; }
          [ "$T_APP" = "KJ63M9QZUG" ] || echo "::warning::Team-ID $T_APP — App-Gruppe in finder-ablage/ und src-tauri anpassen"
          RECHTE_APP=$(codesign -d --entitlements - "$APP" 2>/dev/null || true)
          case "$RECHTE_APP" in *KJ63M9QZUG.com.sinclairs-solutions.atlas*) ;; *) echo "::error::App ohne App-Gruppe signiert"; exit 1;; esac

          # Updater-Paket enthält die Erweiterung (sonst verlöre sie jedes Update).
          TGZ="$APP.tar.gz"
          if [ -f "$TGZ" ]; then
            # grep ohne -q: liest alles, sonst bricht tar mit SIGPIPE ab (pipefail).
            tar -tzf "$TGZ" > "$RUNNER_TEMP/tgz-liste.txt"
            grep -F "Contents/PlugIns/$ERWEITERUNG_NAME/Contents/Info.plist" "$RUNNER_TEMP/tgz-liste.txt" > /dev/null \
              || { echo "::error::Updater-Paket ohne Safari-Erweiterung"; exit 1; }
            grep -F "Contents/PlugIns/AtlasAblage.appex/Contents/Info.plist" "$RUNNER_TEMP/tgz-liste.txt" > /dev/null \
              || { echo "::error::Updater-Paket ohne Ablage-Erweiterung"; exit 1; }
          else
            echo "::warning::Kein Updater-Paket gefunden ($TGZ)"
          fi

      - name: DMG als Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sinclair-Atlas-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Schlüsselbund aufräumen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signieren.keychain-db" 2>/dev/null || true


  windows:
    name: Windows (Installer${{ (startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_AUSLIEFERN == 'true') && ', ausgeliefert' || ', nicht ausgeliefert' }})
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Ausliefern nur bei Tags UND gesetzter Repo-Variable. Probe (von Hand):
      # Updater-Paket bauen, aber nichts veröffentlichen.
      AUSLIEFERN: ${{ startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_AUSLIEFERN == 'true' }}
      UPDATER: ${{ (startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_AUSLIEFERN == 'true') || inputs.windows_probe == true }}
      WINDOWS_SIGNIEREN: ${{ vars.WINDOWS_SIGNIEREN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten
        run: bun install --frozen-lockfile

      # Mit -D warnings: die Windows-eigenen Pfade (Ablage im Explorer,
      # Anmeldeinformationsverwaltung, Taskleiste, Infobereich) werden nur hier
      # übersetzt — eine Warnung (z. B. ungenutzter Code) fällt sonst niemandem auf.
      - name: Tests (Windows-Code ohne Warnungen)
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Secrets vorhanden?
        shell: bash
        env:
          UPD_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZ_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          fehlt=0
          if [ "$UPDATER" = "true" ] && [ -z "$UPD_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt (siehe TODO.md)"; fehlt=1
          fi
          if [ "${WINDOWS_SIGNIEREN:-}" = "true" ]; then
            for n in AZ_ID AZ_SECRET AZ_TENANT; do
              if [ -z "${!n}" ]; then echo "::error::Azure-Secret für $n fehlt (siehe TODO.md §4)"; fehlt=1; fi
            done
            if grep -q 'ERSETZEN_' src-tauri/tauri.windows-signatur.conf.json; then
              echo "::error::src-tauri/tauri.windows-signatur.conf.json enthält noch ERSETZEN_… (siehe TODO.md §4)"; fehlt=1
            fi
          fi
          exit $fehlt

      # --- Signatur: vorbereitet, aber aus. Einschalten über die Repo-Variable
      # WINDOWS_SIGNIEREN = true, sobald Azure Trusted Signing eingerichtet ist
      # (siehe TODO.md §4). Bis dahin ist der Installer unsigniert und
      # SmartScreen warnt beim ersten Start des Installers.
      - name: Signierwerkzeug installieren
        if: vars.WINDOWS_SIGNIEREN == 'true'
        run: cargo install trusted-signing-cli --locked

      - name: Installer bauen
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Updater-Schlüssel nur, wenn ein Updater-Paket entstehen soll
          # (Tauri signiert damit das -setup.exe → -setup.exe.sig).
          TAURI_SIGNING_PRIVATE_KEY: ${{ ((startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_AUSLIEFERN == 'true') || inputs.windows_probe == true) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ ((startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_AUSLIEFERN == 'true') || inputs.windows_probe == true) && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          ZUSATZ=()
          if [ "$UPDATER" != "true" ]; then
            # Kein Updater-Paket (und kein Schlüssel nötig) — wie vor dem Ausliefern.
            ZUSATZ+=(--config src-tauri/tauri.windows.ungeliefert.conf.json)
          fi
          if [ "${WINDOWS_SIGNIEREN:-}" = "true" ]; then
            ZUSATZ+=(--config src-tauri/tauri.windows-signatur.conf.json)
          fi
          bunx tauri build --bundles nsis "${ZUSATZ[@]}"

      - name: Installer prüfen
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "Kein -setup.exe gebaut"; exit 1 }
          "Installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          $sig = Get-AuthenticodeSignature $exe.FullName
          "Authenticode: $($sig.Status) $($sig.SignerCertificate.Subject)"
          $signiert = $sig.Status -eq 'Valid'
          if ($env:WINDOWS_SIGNIEREN -eq 'true' -and -not $signiert) { Write-Error "Signatur eingeschaltet, aber Installer nicht gültig signiert"; exit 1 }
          if ($env:UPDATER -eq 'true' -and -not (Test-Path "$($exe.FullName).sig")) { Write-Error "Updater-Signatur $($exe.Name).sig fehlt"; exit 1 }
          # Kennzeichen für die Atlas-Downloadseite (SmartScreen-Hinweis bei unsigniert).
          @{ signiert = $signiert; datei = $exe.Name } | ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM src-tauri/target/release/bundle/nsis/windows.json
          Get-Content src-tauri/target/release/bundle/nsis/windows.json

      - name: Installer als Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.UPDATER == 'true' && 'Sinclair-Atlas-Windows' || 'Sinclair-Atlas-Windows-ungeliefert' }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/windows.json
          if-no-files-found: error

  # Windows in den Release-Entwurf, den der macOS-Job (tauri-action) angelegt
  # hat. Läuft erst nach BEIDEN Jobs: so gibt es den Entwurf schon, und nur ein
  # Job schreibt latest.json (kein Wettlauf zweier tauri-action-Läufe).
  windows-release:
    name: Windows in den Release-Entwurf${{ !startsWith(github.ref, 'refs/tags/') && ' (Trockenlauf)' || '' }}
    needs: [macos, windows]
    if: (startsWith(github.ref, 'refs/tags/') && vars.WINDOWS_AUSLIEFERN == 'true') || inputs.windows_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Sinclair-Atlas-Windows
          path: windows

      - name: Hochladen und latest.json ergänzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IST_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          V=$(jq -r .version package.json)
          EXE=$(ls windows/*-setup.exe | head -1)
          test -f "$EXE.sig" || { echo "::error::$EXE.sig fehlt"; exit 1; }
          # GitHub ersetzt Leerzeichen in Asset-Namen durch Punkte — gleich so
          # benennen, damit die Adresse in latest.json stimmt.
          NAME="Sinclair.Atlas_${V}_x64-setup.exe"
          mkdir -p hoch
          cp "$EXE" "hoch/$NAME"
          cp "$EXE.sig" "hoch/$NAME.sig"
          cp windows/windows.json hoch/windows.json
          SIGDATEI="hoch/$NAME.sig"

          if [ "$IST_TAG" = "true" ]; then
            TAG="$GITHUB_REF_NAME"
            ENTWURF=$(gh release view "$TAG" --json isDraft -q .isDraft)
            # Nie einen schon veröffentlichten Release verändern.
            [ "$ENTWURF" = "true" ] || { echo "::error::Release $TAG ist kein Entwurf — nichts geändert"; exit 1; }
            gh release download "$TAG" -p latest.json -O latest.json
          else
            # Trockenlauf: gegen den neuesten veröffentlichten Release, nichts hochladen.
            TAG=$(gh release view --json tagName -q .tagName)
            gh release download "$TAG" -p latest.json -O latest.json
            V=$(jq -r .version latest.json)
            NAME="Sinclair.Atlas_${V}_x64-setup.exe"
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          bash scripts/windows-in-latest-json.sh latest.json hoch/latest.json "$URL" "$SIGDATEI" "$V"

          if [ "$IST_TAG" = "true" ]; then
            gh release upload "$TAG" "hoch/$NAME" "$SIGDATEI" hoch/windows.json --clobber
            gh release upload "$TAG" hoch/latest.json --clobber
            gh release view "$TAG" --json assets -q '.assets[].name'
          else
            echo "Trockenlauf gegen $TAG — nichts hochgeladen."
            cat hoch/latest.json | jq '.platforms | map_values(.url)'
          fi
