<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Schnellerfassung</title>
  <link rel="stylesheet" href="gemeinsam.css" />
  <style>
    main { padding: 0 18px 16px; }
    .unten { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .links { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div class="zieh" data-tauri-drag-region></div>
  <main>
    <h1 data-de="Schnellerfassung" data-en="Quick capture">Schnellerfassung</h1>
    <div class="leise" style="margin-bottom:8px" data-de="Erste Zeile wird der Titel. ⌘↩ speichert." data-en="First line becomes the title. ⌘↩ saves.">Erste Zeile wird der Titel. ⌘↩ speichert.</div>
    <textarea id="text" rows="5" autofocus></textarea>
    <div class="unten">
      <div class="links">
        <button id="foto" title="Bildschirmfoto in den Eingang" data-de="📷 Bildschirmfoto" data-en="📷 Screenshot">📷 Bildschirmfoto</button>
        <button id="beleg" data-de="📄 Beleg …" data-en="📄 Receipt …">📄 Beleg …</button>
      </div>
      <div class="links">
        <button id="notiz" data-de="Als Notiz" data-en="As note">Als Notiz</button>
        <button id="aufgabe" class="haupt" data-de="Als Aufgabe" data-en="As task">Als Aufgabe</button>
      </div>
    </div>
    <div class="meldung" id="meldung"></div>
  </main>
  <script src="sprache.js"></script>
  <script src="notiz.js"></script>
</body>
</html>
